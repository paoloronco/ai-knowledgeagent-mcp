services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    image: paoloronco/knowledge-mcp:latest
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_ROOT: /knowledge
      INGESTION_BASE_DIR: /data/ingestion
      POLICY_FILE: /data/index-policy.yaml
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_HOST_PATH:?Set KNOWLEDGE_HOST_PATH to an existing directory}
        target: /knowledge
        read_only: true
        bind:
          create_host_path: false
      - app_data:/data

volumes:
  qdrant_data:
  app_data:
