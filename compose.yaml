services:
  app:
    image: paoloronco/knowledge-mcp:latest
    restart: unless-stopped
    environment:
      KNOWLEDGE_ROOT: /data/documents
      INGESTION_BASE_DIR: /data/ingestion
      POLICY_FILE: /data/index-policy.yaml
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    volumes:
      - app_data:/data
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  app_data:
