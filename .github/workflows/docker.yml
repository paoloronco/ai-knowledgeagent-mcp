name: Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: knowledge-mcp/requirements.txt
      - name: Test
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r knowledge-mcp/requirements.txt
          python -m unittest discover -s tests -q
          node --test tests/test_dashboard.js
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/knowledge-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads((Path(os.environ["RUNNER_TEMP"]) / "knowledge-compose.json").read_text())
          app = config["services"]["app"]
          assert app["container_name"] == "knowledge-mcp"
          assert app["restart"] == "unless-stopped"
          assert {(port["published"], port["target"]) for port in app["ports"]} == {("8080", 8080), ("8000", 8000)}
          assert {(volume["source"], volume["target"]) for volume in app["volumes"]} == {("app_data", "/data"), ("qdrant_data", "/qdrant/storage"), ("host_agent_data", "/run/host-agent")}
          agent = config["services"]["host-agent"]
          assert agent["read_only"] and agent["network_mode"] == "service:app"
          assert agent["cap_drop"] == ["ALL"] and agent["cap_add"] == ["DAC_READ_SEARCH"]
          assert any(mount["source"] == "/" and mount["target"] == "/host" and mount["read_only"] for mount in agent["volumes"])
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Build for startup test
        uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          load: true
          tags: knowledge-mcp:smoke
      - name: Verify automatic Docker host access, Web UI and Qdrant
        run: |
          mkdir -p "$RUNNER_TEMP/knowledge-smoke-docs"
          printf 'Knowledge MCP smoke test document.\n' > "$RUNNER_TEMP/knowledge-smoke-docs/note.md"
          mkdir -p "$RUNNER_TEMP/knowledge-agent-docs"
          printf 'Host agent document.\n' > "$RUNNER_TEMP/knowledge-agent-docs/host.md"
          export UI_PORT=18080 MCP_PORT=18000
          cat > "$RUNNER_TEMP/knowledge-smoke.yaml" <<EOF
          services:
            app:
              image: knowledge-mcp:smoke
              container_name: knowledge-smoke
              volumes:
                - $RUNNER_TEMP/knowledge-smoke-docs:/mnt/knowledge:ro
            host-agent:
              image: knowledge-mcp:smoke
          EOF
          trap 'docker compose -p knowledge-smoke -f compose.yaml -f "$RUNNER_TEMP/knowledge-smoke.yaml" down -v >/dev/null 2>&1 || true' EXIT
          docker compose -p knowledge-smoke -f compose.yaml -f "$RUNNER_TEMP/knowledge-smoke.yaml" up -d
          if ! python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      if json.load(response)["qdrant_ready"]:
                          break
              except (OSError, urllib.error.HTTPError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Qdrant and Web UI did not become healthy")

          with urllib.request.urlopen(base) as response:
              page = response.read().decode()
          assert "First-time setup" in page
          assert "host_agent.py install" not in page and "Generate pairing key" not in page
          token = re.search(r"const token='([^']+)'", page).group(1)
          request = urllib.request.Request(
              base + "/api/config",
              data=json.dumps({"document_root": "/mnt/knowledge", "source_selection": "container", "folders": [""], "interval_hours": 0}).encode(),
              headers={"Content-Type": "application/json", "X-Control-Token": token},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              config = json.load(response)
          assert config["source_root"] == "/mnt/knowledge"
          with urllib.request.urlopen(base + "/api/status", timeout=3) as response:
              status = json.load(response)
          assert status["source_ready"] and status["source_root"] == "/mnt/knowledge"
          def post(path, body, cookie=""):
              headers = {"Content-Type": "application/json", "X-Control-Token": token}
              if cookie:
                  headers["Cookie"] = cookie
              req = urllib.request.Request(base + path, data=json.dumps(body).encode(), headers=headers)
              return urllib.request.urlopen(req, timeout=10)
          post("/api/security", {"enabled": True, "password": "smoke-test-password"}).close()
          login = urllib.request.Request(base + "/api/login", data=json.dumps({"password": "smoke-test-password"}).encode(), headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(login, timeout=10) as response:
              cookie = response.headers["Set-Cookie"].split(";", 1)[0]
          def status():
              with urllib.request.urlopen(urllib.request.Request(base + "/api/status", headers={"Cookie": cookie}), timeout=3) as response:
                  return json.load(response)
          def wait_source(root):
              for _ in range(90):
                  state = status()
                  if state["agent_error"]:
                      raise SystemExit(state["agent_error"])
                  if state["agent_managed"] and state["source_ready"] and state["config"]["host_root"] == root:
                      return state
                  time.sleep(1)
              raise SystemExit("Docker host agent did not synchronize the selected folder")
          host_root = str(Path(os.environ["RUNNER_TEMP"]) / "knowledge-agent-docs")
          with post("/api/config", {"document_root": host_root, "source_selection": "auto", "folders": [""]}, cookie) as response:
              config = json.load(response)
          assert config["source_mode"] == "host_agent" and config["host_root"] == host_root
          assert config["source_selection"] == "auto"
          assert wait_source(host_root)["agent_file_count"] == 1
          next_root = Path(os.environ["RUNNER_TEMP"]) / "knowledge-agent-next"
          next_root.mkdir()
          (next_root / "second.md").write_text("Second folder document", encoding="utf-8")
          (next_root / "sample-folder").mkdir()
          (next_root / "sample-folder" / "excluded.md").write_text("Excluded fixture", encoding="utf-8")
          post("/api/config", {"document_root": str(next_root), "source_selection": "auto", "folders": [""]}, cookie).close()
          assert wait_source(str(next_root))["agent_file_count"] == 1
          subprocess.run(["docker", "exec", "knowledge-smoke", "python", "-c", "from pathlib import Path; p=Path('/data/host-documents'); assert (p/'second.md').read_text() == 'Second folder document'; assert not (p/'host.md').exists(); assert not (p/'sample-folder/excluded.md').exists()"], check=True)
          subprocess.run(["docker", "compose", "-p", "knowledge-smoke", "-f", "compose.yaml", "-f", str(Path(os.environ["RUNNER_TEMP"]) / "knowledge-smoke.yaml"), "restart"], check=True)
          # The retained credentials reconnect the agent after both containers restart.
          for _ in range(90):
              try:
                  with urllib.request.urlopen(login, timeout=3) as response:
                      cookie = response.headers["Set-Cookie"].split(";", 1)[0]
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Dashboard did not restart")
          assert wait_source(str(next_root))["agent_file_count"] == 1
          request = urllib.request.Request(base + "/api/upload?path=blocked.md", data=b"blocked", headers={"X-Control-Token": token, "Cookie": cookie})
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise SystemExit("Document upload endpoint is still available")
          post("/api/service", {"name": "mcp", "action": "start"}, cookie).close()
          for _ in range(60):
              with urllib.request.urlopen(urllib.request.Request(base + "/api/status", headers={"Cookie": cookie}), timeout=3) as response:
                  if json.load(response)["mcp_running"]:
                      break
              time.sleep(1)
          else:
              raise SystemExit("MCP did not start")
          PY
          then
            docker logs knowledge-smoke
            docker compose -p knowledge-smoke -f compose.yaml -f "$RUNNER_TEMP/knowledge-smoke.yaml" logs host-agent
            exit 1
          fi
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: paoloronco/knowledge-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@v4
        id: login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Require Docker Hub login
        if: github.event_name != 'pull_request' && steps.login.outcome != 'success'
        run: |
          echo '::error::Docker Hub login failed; verify DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.'
          exit 1
