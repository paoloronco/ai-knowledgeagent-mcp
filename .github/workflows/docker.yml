name: Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: knowledge-mcp/requirements.txt
      - name: Test
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r knowledge-mcp/requirements.txt
          python -m unittest discover -s tests -q
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build for startup test
        uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          load: true
          tags: knowledge-mcp:smoke
      - name: Verify standalone Web UI and Qdrant
        run: |
          docker run -d --name knowledge-smoke -p 0.0.0.0:18080:8080 knowledge-mcp:smoke
          trap 'docker rm -f knowledge-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if curl -fsS -H 'Host: 10.10.10.80:8080' http://127.0.0.1:18080/ 2>/dev/null | grep -q 'Local document indexing' \
              && curl -fsS http://127.0.0.1:18080/api/status 2>/dev/null \
                | python -c 'import json, sys; status = json.load(sys.stdin); sys.exit(not (status["qdrant_ready"] and status["mcp_running"]))' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs knowledge-smoke
          exit 1
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: paoloronco/knowledge-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@v4
        id: login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Require Docker Hub login
        if: github.event_name != 'pull_request' && steps.login.outcome != 'success'
        run: |
          echo '::error::Docker Hub login failed; verify DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.'
          exit 1
