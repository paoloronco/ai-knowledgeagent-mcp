name: Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: knowledge-mcp/requirements.txt
      - name: Test
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r knowledge-mcp/requirements.txt
          python -m unittest discover -s tests -q
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build for startup test
        uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          load: true
          tags: knowledge-mcp:smoke
      - name: Verify standalone Web UI and Qdrant
        run: |
          docker run -d --name knowledge-smoke -p 0.0.0.0:18080:8080 knowledge-mcp:smoke
          trap 'docker rm -f knowledge-smoke >/dev/null 2>&1 || true' EXIT
          if ! python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:18080"
          for _ in range(90):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                      if json.load(response)["qdrant_ready"]:
                          break
              except (OSError, urllib.error.HTTPError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Qdrant and Web UI did not become healthy")

          with urllib.request.urlopen(base) as response:
              page = response.read().decode()
          assert "Prima configurazione" in page
          token = re.search(r"const token='([^']+)'", page).group(1)
          request = urllib.request.Request(
              base + "/api/service",
              data=json.dumps({"name": "mcp", "action": "start"}).encode(),
              headers={"Content-Type": "application/json", "X-Control-Token": token},
          )
          urllib.request.urlopen(request, timeout=10).close()
          for _ in range(60):
              with urllib.request.urlopen(base + "/api/status", timeout=3) as response:
                  if json.load(response)["mcp_running"]:
                      break
              time.sleep(1)
          else:
              raise SystemExit("MCP did not start")
          PY
          then
            docker logs knowledge-smoke
            exit 1
          fi
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: paoloronco/knowledge-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@v4
        id: login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./knowledge-mcp
          file: ./knowledge-mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.login.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Require Docker Hub login
        if: github.event_name != 'pull_request' && steps.login.outcome != 'success'
        run: |
          echo '::error::Docker Hub login failed; verify DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.'
          exit 1
